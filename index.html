<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Tours</title><style>
:root{--ink:#1c1a22;--muted:#6b6878;--line:#e6e2ea;--bg:#faf8fb;--accent:#1B3A6B;--no:#991b1b;--nobg:#fdecec}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#1B3A6B,#6f9bd3);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-size:15px}
.card{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
h1{font-size:24px;margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px;font-size:14px}
label{font-size:12px;font-weight:600;display:block;margin:12px 0 4px}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.guest{display:block;text-align:center;margin-top:14px;font-size:14px;color:var(--accent)}
#err{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--nobg);color:var(--no);font-size:13px}
</style></head><body>
<main class="card"><h1>Welcome</h1><p class="sub">Sign in to see agent and staff details, or browse as a guest.</p>
<form id="f" autocomplete="on"><label for="u">User name</label><input id="u" autocomplete="username" required>
<label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
<button id="b" type="submit">Sign in</button><div id="err" role="alert"></div></form>
<a class="guest" href="#" id="g">Continue as guest</a></main>
<script>
/* TEST LOGIN ONLY. The sheet must be shared "Anyone with the link can view". Passwords are plain text and every page's visibility is client-side,
   so anyone viewing page source can see all tiers. Replace with real server-side auth and gating before any public launch. */
var SHEET='1bEu3cEODf9QOQ2UYMc_57xK3qGlrOLKm4jRvZPNclq0',GID='0';
var ROLES=['admin','staff','agent','agent staff','customer'];
var f=document.getElementById('f'),err=document.getElementById('err'),b=document.getElementById('b');
function fail(t){err.textContent=t;err.style.display='block';b.disabled=false;b.textContent='Sign in'}
function go(role,name,company){try{sessionStorage.setItem('role',role);sessionStorage.setItem('name',name||'');sessionStorage.setItem('company',company||'')}catch(e){}location.href='city.html'}
function cell(c){return c&&c.v!=null?String(c.v).trim():''}
document.getElementById('g').onclick=function(e){e.preventDefault();go('Customer','','')};
f.onsubmit=function(e){e.preventDefault();err.style.display='none';b.disabled=true;b.textContent='Checking…';
var u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
fetch('https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tqx=out:json&gid='+GID).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
var j=JSON.parse(t.substring(t.indexOf('{'),t.lastIndexOf('}')+1)),rows=(j.table&&j.table.rows)||[],hit=null;
rows.forEach(function(r){var c=r.c||[];if(cell(c[4]).toLowerCase()===u.toLowerCase()&&cell(c[5])===p&&cell(c[4]).toLowerCase()!=='username')hit=c});
if(!hit)return fail('User name or password not recognised.');
var role=cell(hit[3]);if(ROLES.indexOf(role.toLowerCase())<0)return fail('This account has no valid user type. Contact your administrator.');
go(role,cell(hit[1]),cell(hit[2]))}).catch(function(){fail('Could not reach the user list. Check the sheet is shared as view-only for anyone with the link.')})};
</script></body></html>
