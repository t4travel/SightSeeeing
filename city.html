<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Destinations | Tours</title><style>
:root{--ink:#1c1a22;--muted:#6b6878;--line:#e6e2ea;--bg:#faf8fb;--accent:#1B3A6B;--accent2:#e8eef8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
.hero{background:linear-gradient(135deg,#1B3A6B,#6f9bd3);color:#fff;padding:32px 20px}.w{max-width:1180px;margin:0 auto}
.top{display:flex;justify-content:flex-end;gap:12px;font-size:13px;margin-bottom:14px;align-items:center}
.top a{color:#fff}.badge{background:rgba(255,255,255,.2);border-radius:99px;padding:3px 12px}
.hero h1{font-size:36px}.hero p{opacity:.9;margin-top:6px;max-width:640px}
.bar{margin:20px 0}input{padding:10px 14px;border:1px solid var(--line);border-radius:99px;min-width:260px;font:inherit}
input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding-bottom:40px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;display:block}
a.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.1)}.card.soon{opacity:.65}
.th{height:160px;background:linear-gradient(135deg,#5b4b8a,#a99bd3) center/cover;position:relative}
.th span{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 10px;border-radius:99px}
.ct{padding:14px}h3{font-size:18px}.s{color:var(--muted);font-size:13px}
#none{display:none;color:var(--muted);padding:20px 0}
</style></head><body>
<div class="hero"><div class="w"><div class="top"><span class="badge" id="who">Guest</span><a href="index.html" id="auth">Sign in</a></div>
<h1>Destinations</h1><p>Choose a city to see its tours, attractions and tickets.</p></div></div>
<div class="w"><div class="bar"><input id="q" placeholder="Search cities…" aria-label="Search cities"></div>
<div class="grid" id="g">
<a class="card" data-n="paris france" href="paris/indexParis.html"><div class="th" data-wiki="Paris"><span>Live</span></div><div class="ct"><h3>Paris</h3><p class="s">France · 15 tours, monuments and passes</p></div></a>
<a class="card" data-n="rome italy" href="rome/indexRome.html"><div class="th" data-wiki="Rome"><span>Live</span></div><div class="ct"><h3>Rome</h3><p class="s">Italy · 7 tours, monuments and day trips</p></div></a>
</div><p id="none">No cities match your search.</p></div>
<script>
/* Role comes from index.html (sessionStorage). Client-side only; see the note in index.html. */
var role='Customer',name='';try{role=sessionStorage.getItem('role')||'Customer';name=sessionStorage.getItem('name')||''}catch(e){}
document.getElementById('who').textContent=(name?name+' · ':'')+role;
if(role!=='Customer'||name){var a=document.getElementById('auth');a.textContent='Sign out';a.onclick=function(){try{sessionStorage.clear()}catch(e){}}}
var cs=document.querySelectorAll('#g .card');
document.getElementById('q').oninput=function(){var q=this.value.toLowerCase(),n=0;cs.forEach(function(c){var ok=c.dataset.n.indexOf(q)>-1;c.style.display=ok?'':'none';if(ok)n++});document.getElementById('none').style.display=n?'none':'block'};
document.querySelectorAll('.th').forEach(function(e){fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(e.dataset.wiki)).then(function(r){return r.json()}).then(function(j){var s=j.thumbnail&&j.thumbnail.source;if(s)e.style.backgroundImage='url('+s+')'}).catch(function(){})});
</script></body></html>
